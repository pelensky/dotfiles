# ~/.config/tmuxinator/purposemed.yml
name: PurposeMed
root: ~/Work/core/
windows:
  - 📊:
      layout: 4731,111x28,0,0{84x28,0,0,1,26x28,85,0[26x6,85,0,5,26x6,85,7,6,26x6,85,14,7,26x7,85,21,8]}
      panes:
        - commands:
            - cd ~/Work/core/back-end
            - pg_ctl start || true
            - bin/run-dev
        - commands:
            - cd ~/Work/core/front-end
            - yarn workspace freddie localstart
        - commands:
            - cd ~/Work/core/front-end
            - yarn workspace frida localstart
        - commands:
            - cd ~/Work/core/front-end
            - yarn workspace purposemed localstart
        - commands:
            - cd ~/Work/core/back-end
            - bundle exec good_job start
  - 🤖:
      root: ~/Work/core/
      panes:
        - commands:
            - claude
  - 🔎:
      root: ~/Work/core/
      panes:
        - commands:
            - claude
  - 🍏:
      root: ~/Work/core/
      panes:
  - ⬅️:
      root: ~/Work/core/back-end
      panes:
  - ➡️:
      root: ~/Work/core/front-end
      panes:
